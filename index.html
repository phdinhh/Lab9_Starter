<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>

  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
  <script>
  window.TrackJS && TrackJS.install({ 
    token: "3a737a9d419e459dae34c3b588f6f37a"
    // for more configuration options, see https://docs.trackjs.com
  });
  </script>
  <script>
    window.onerror = function(message, url, line, column, error) {
      console.log("Oh no, it's a global error...");
      console.log("haha L");
      console.log("sorry here's some real info");
      console.log("Error message: ", message);
      console.log("URL: ", url);
      console.log("Line: ", line);
      console.log("Column: ", column);
      console.log("Error object: ", error);
      return true;
    };

    class FunnyError extends Error {
      constructor(message) {
        super(message);
        this.name = 'FunnyError';
      }
    }

    class DivisionError extends Error {
      constructor(message) {
        super(message);
        this.name = 'DivisionError';
      }
    }
    
    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');
      try {
        let firstNum = document.querySelector('#first-num').value;
        let secondNum = document.querySelector('#second-num').value;
        let operator = document.querySelector('#operator').value;

        if (secondNum === "" || firstNum == "") {
          throw new Error("Put some numbers in first");
        }

        if (Number(secondNum) === 0 && operator === "/") {
          throw new DivisionError("Can't divide by zero, twin :/");
        }

        if (Number(firstNum) === 6 && Number(secondNum) === 7) {
          throw new FunnyError("haha 67 67 67 67 67");
        }

        output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
      }
      catch(error) {
        console.error(error);
        output.textContent = error.message;
      }
      finally {
        console.log('Hmm there was some sort of error...');
      }
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    // Start your code here
    // You may move this JS to another file if you wish
    
    // console log
    errorBtns[0].addEventListener('click', () => {
      console.log('Console Log Demo');
    });

    // console error
    errorBtns[1].addEventListener('click', () => {
      console.error('Console Error Demo');
    });

    // console count
    errorBtns[2].addEventListener('click', () => {
      console.count('Count Button');
    });

    // console warn
    errorBtns[3].addEventListener('click', () => {
      console.warn('Console Warn Button');
    });

    // console assert
    errorBtns[4].addEventListener('click', () => {
      console.assert(false, 'Console Assert Demo');
    });

    // console clear
    errorBtns[5].addEventListener('click', () => {
      console.clear();
    });

    // console dir
    errorBtns[6].addEventListener('click', () => {
      console.dir(errorBtns[6]);
    });

    // console dirxml
    errorBtns[7].addEventListener('click', () => {
      console.dirxml(errorBtns[7]);
    });

    // console group start
    errorBtns[8].addEventListener('click', () => {
      console.group();
    });

    // console group end
    errorBtns[9].addEventListener('click', () => {
      console.groupEnd();
    });

    // console table
    errorBtns[10].addEventListener('click', () => {
      console.table([
        {num: 0, name: 'CSE 110', id: 110},
        {num: 1, name: 'CSE 100', id: 100},
        {num: 2, name: 'CSE 101', id: 101}
      ]);
    });

    // console timer start
    errorBtns[11].addEventListener('click', () => {
      console.time('Timer Button');
    });

    // console timer end
    errorBtns[12].addEventListener('click', () => {
      console.timeEnd('Timer Button');
    });

    // console trace
    errorBtns[13].addEventListener('click', () => {
      console.trace();
    });

    // global error
    errorBtns[14].addEventListener('click', () => {
      thisIsNotARealFunctionOops();
    });
  </script>
</body>

</html>
